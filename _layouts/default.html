<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <style>
    :root { --ink:#20262c; --muted:#69757d; --line:#e2e6e9; --paper:#f7f8f9; --blue:#365c78; --blue-dark:#25465d; --serif:Georgia,"Noto Serif SC","Songti SC",serif; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    * { box-sizing:border-box; }
    html { background:var(--paper); }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); }
    a { color:inherit; }
    .site-header { max-width:1080px; margin:0 auto; padding:28px 28px 24px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
    .brand { text-decoration:none; display:flex; align-items:center; gap:12px; }
    .mark { width:34px; height:34px; display:grid; place-items:center; background:var(--blue); color:#fff; border-radius:3px; font-family:var(--serif); font-size:21px; }
    .brand-name { font-family:var(--serif); font-size:20px; letter-spacing:.04em; }
    .brand-sub { display:block; margin-top:2px; color:var(--muted); font-size:10px; letter-spacing:.14em; }
    .nav { display:flex; gap:20px; color:var(--muted); font-size:13px; }
    .nav a { text-decoration:none; }
    .nav a:hover { color:var(--blue); }
    .container { max-width:1080px; margin:0 auto; padding:0 28px 72px; }
    .hero { padding:72px 0 48px; border-bottom:1px solid var(--line); }
    .eyebrow { color:var(--blue); font-size:11px; letter-spacing:.14em; text-transform:uppercase; margin-bottom:16px; }
    h1,h2,h3 { font-family:var(--serif); font-weight:400; }
    .hero h1 { margin:0; max-width:690px; font-size:clamp(38px,6vw,68px); line-height:1.08; letter-spacing:-.05em; }
    .hero h1 em { color:var(--blue); font-style:normal; }
    .hero p { max-width:500px; color:var(--muted); line-height:1.9; margin:22px 0 0; }
    .section-head { display:flex; align-items:end; justify-content:space-between; gap:16px; margin:36px 0 14px; }
    .section-head h2 { margin:0; font-size:23px; }
    .section-head span { color:var(--muted); font-size:12px; }
    .post-list { border-top:2px solid var(--ink); }
    .post-item { display:grid; grid-template-columns:1fr 140px; gap:24px; padding:24px 0; border-bottom:1px solid var(--line); text-decoration:none; }
    .post-item:hover { background:#eef2f4; padding-left:14px; padding-right:14px; }
    .post-type { color:var(--blue); font-size:10px; letter-spacing:.13em; text-transform:uppercase; }
    .post-item h3 { margin:8px 0 8px; font-size:23px; }
    .post-excerpt { color:var(--muted); font-size:14px; line-height:1.75; margin:0; }
    .post-meta { color:var(--muted); font-size:12px; line-height:1.8; text-align:right; }
    .tag { display:inline-block; color:var(--blue); border:1px solid #c9d5dd; padding:3px 7px; margin:4px 3px 0 0; border-radius:2px; font-size:11px; }
    .article { max-width:760px; margin:0 auto; padding-top:68px; }
    .article-header { padding-bottom:28px; border-bottom:1px solid var(--line); }
    .article h1 { margin:12px 0 16px; font-size:clamp(34px,5vw,56px); line-height:1.15; letter-spacing:-.045em; }
    .article-meta { color:var(--muted); font-size:13px; }
    .article-body { padding-top:32px; font-family:var(--serif); font-size:18px; line-height:2; }
    .article-body h2 { margin:36px 0 10px; font-size:28px; line-height:1.3; }
    .article-body h3 { margin:28px 0 8px; font-size:23px; }
    .article-body p { margin:0 0 20px; }
    .article-body ul,.article-body ol { padding-left:1.5em; }
    .article-body blockquote { border-left:3px solid var(--blue); color:var(--muted); margin:24px 0; padding:4px 0 4px 20px; }
    .article-body code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.86em; background:#edf1f3; padding:2px 5px; }
    .article-body pre { overflow:auto; padding:16px; background:#20262c; color:#eef2f4; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:14px; line-height:1.6; }
    .article-body img { max-width:100%; height:auto; }
    .back { display:inline-block; margin-top:40px; color:var(--blue); text-decoration:none; font-size:13px; }
    .footer { max-width:1080px; margin:0 auto; padding:22px 28px 34px; color:var(--muted); border-top:1px solid var(--line); font-size:12px; }
    @media (max-width:640px) { .site-header { padding:20px 16px; } .container { padding:0 16px 48px; } .nav { gap:12px; } .brand-sub { display:none; } .hero { padding:50px 0 34px; } .post-item { grid-template-columns:1fr; gap:8px; } .post-meta { text-align:left; } .article { padding-top:46px; } .article-body { font-size:17px; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="mark">观</span><span><span class="brand-name">{{ site.title }}</span><span class="brand-sub">NOTES · STUDY · ESSAYS</span></span></a>
    <nav class="nav"><a href="{{ '/' | relative_url }}">首页</a><a href="{{ '/feed.xml' | relative_url }}">订阅</a></nav>
  </header>
  {{ content }}
  <footer class="footer">© {{ 'now' | date: '%Y' }} {{ site.title }} · 写下正在发生的事。</footer>
</body>
</html>

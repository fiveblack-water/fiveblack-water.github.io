---
layout: default
---
<main class="container">
  <article class="article">
    <header class="article-header">
      <div class="eyebrow">{{ page.categories | first | default: 'ESSAY' }}</div>
      <h1>{{ page.title }}</h1>
      <div class="article-meta">{{ page.date | date: '%Y年%m月%d日' }}{% if page.tags %} · {% for tag in page.tags %}{{ tag }}{% unless forloop.last %} / {% endunless %}{% endfor %}{% endif %}</div>
    </header>
    <div class="article-body">{{ content }}</div>
    <a class="back" href="{{ '/' | relative_url }}">← 返回文章列表</a>
  </article>
</main>
